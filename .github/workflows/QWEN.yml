name: Build Murzik Firmware (ESP32-P4)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ESP-IDF environment
        run: |
          . /opt/esp/idf/export.sh
          echo "IDF_PATH=/opt/esp/idf" >> $GITHUB_ENV
          echo "/opt/esp/idf/tools" >> $GITHUB_PATH

      - name: Patch esp_driver_isp missing header (IDF v5.5.2 bug)
        run: |
          . /opt/esp/idf/export.sh
          ISP_CORE="/opt/esp/idf/components/esp_driver_isp/src/isp_core.c"
          ISP_AF="/opt/esp/idf/components/esp_driver_isp/src/isp_af.c"
          
          # Добавляем #include "esp_memory_utils.h" после #include "esp_log.h"
          sed -i '/#include "esp_log.h"/a #include "esp_memory_utils.h"' "$ISP_CORE"
          sed -i '/#include "esp_log.h"/a #include "esp_memory_utils.h"' "$ISP_AF"
          
          echo "✅ Patched isp_core.c and isp_af.c with esp_memory_utils.h"

      - name: Configure and Build
        run: |
          . /opt/esp/idf/export.sh
          # КРИТИЧНО: Удаляем кэш конфигурации перед сборкой
          rm -rf build/
          idf.py set-target esp32p4
          idf.py build

      - name: Verify firmware components and sizes
        run: |
          . /opt/esp/idf/export.sh
          
          echo "========================================="
          echo "=== PARTITION TABLE VERIFICATION      ==="
          echo "========================================="
          idf.py partition-table
          
          echo ""
          echo "========================================="
          echo "=== FIRMWARE BINARY SIZE              ==="
          echo "========================================="
          ls -lh build/Murzik.bin
          
          echo ""
          echo "========================================="
          echo "=== ELF SECTIONS SIZE                 ==="
          echo "========================================="
          riscv32-esp-elf-size -A build/Murzik.elf | head -25
          
          echo ""
          echo "========================================="
          echo "=== CRITICAL FILES CHECK              ==="
          echo "========================================="
          test -f build/Murzik.bin && echo "✅ Murzik.bin exists" || echo "❌ Murzik.bin MISSING"
          test -f build/srmodels/srmodels.bin && echo "✅ srmodels.bin exists" || echo "❌ srmodels.bin MISSING"
          test -f build/partition_table/partition-table.bin && echo "✅ partition-table.bin exists" || echo "❌ partition-table.bin MISSING"
          test -f build/bootloader/bootloader.bin && echo "✅ bootloader.bin exists" || echo "❌ bootloader.bin MISSING"
          test -f build/ota_data_initial.bin && echo "✅ ota_data_initial.bin exists" || echo "❌ ota_data_initial.bin MISSING"
          
          echo ""
          echo "========================================="
          echo "=== SDK CONFIG VERIFICATION           ==="
          echo "========================================="
          
          echo "--- Display & LVGL ---"
          grep -E "CONFIG_HAVE_LVGL|CONFIG_LV_USE_IMGFONT|CONFIG_LCD_MIPI_DSI|CONFIG_LV_USE_SNAPSHOT" build/config/sdkconfig.h || echo "⚠️ Display configs not found"
          
          echo "--- Camera & Video ---"
          grep -E "CONFIG_CAMERA_OV5647|CONFIG_ESP_VIDEO_ENABLE_MIPI_CSI|CONFIG_XIAOZHI_ENABLE_CAMERA_DEBUG_MODE|CONFIG_CAM_CTLR_MIPI_CSI_ISR_CACHE_SAFE" build/config/sdkconfig.h || echo "⚠️ Camera configs not found"
          
          echo "--- Audio & ESP-SR (P4 Specific) ---"
          grep -E "CONFIG_USE_AUDIO_PROCESSOR|CONFIG_ESP_SR_ENABLE|CONFIG_ESP_CODEC_DEV_SUPPORT_ES8311|CONFIG_ESP_CODEC_DEV_SUPPORT_ES7210|CONFIG_SR_WN_WN10_NIHAO_XIAO_ZHI" build/config/sdkconfig.h || echo "⚠️ Audio/SR configs not found"
          
          echo "--- PSRAM / MSPI (P4 Specific) ---"
          grep -E "CONFIG_SPIRAM=y|CONFIG_SPIRAM_MODE_HEX|CONFIG_SPIRAM_SPEED_200M|CONFIG_SPIRAM_BOOT_INIT" build/config/sdkconfig.h || echo "⚠️ PSRAM/MSPI configs not found"
          
          echo "--- MCP / Mimiclaw Agent ---"
          grep -E "CONFIG_MCP_ENABLED|CONFIG_HTTPD_WS_SUPPORT|CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN|CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC" build/config/sdkconfig.h || echo "⚠️ MCP/Mimiclaw configs not found"
          
          echo "--- Board & Flash ---"
          grep -E "CONFIG_BOARD_TYPE_WAVESHARE|CONFIG_ESPTOOLPY_FLASHSIZE_32MB|CONFIG_IDF_TARGET_ESP32P4" build/config/sdkconfig.h || echo "⚠️ Board/Flash configs not found"
          
          echo "--- WiFi Remote (SDIO) ---"
          grep -E "CONFIG_ESP_WIFI_REMOTE_ENABLED|CONFIG_ESP_WIFI_REMOTE_SDIO_HOST_ID|CONFIG_DRIVER_SDMMC_IRQ_HANDLER_IN_IRAM" build/config/sdkconfig.h || echo "⚠️ WiFi Remote SDIO configs not found"
          
          echo ""
          echo "========================================="
          echo "=== LOG LEVEL VERIFICATION            ==="
          echo "========================================="
          grep -E "CONFIG_LOG_DEFAULT_LEVEL|CONFIG_LOG_MAXIMUM_LEVEL|CONFIG_LOG_DYNAMIC" build/config/sdkconfig.h || echo "⚠️ Log level configs not found"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: murzik-firmware-esp32p4
          path: |
            build/Murzik.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/srmodels/srmodels.bin
          retention-days: 30
